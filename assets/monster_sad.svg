<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- 背景漸層 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)" rx="24"/>

  <!-- 頭頂小雨雲 -->
  <g transform="translate(145, 45)" filter="url(#shadow)">
    <!-- 雲朵泡泡 -->
    <path d="M 20,40 A 20,20 0 0,1 50,20 A 30,30 0 0,1 95,25 A 22,22 0 0,1 115,45 A 15,15 0 0,1 105,65 L 15,65 A 15,15 0 0,1 20,40 Z" fill="url(#cloudGrad)" />
    <!-- 閃電/小雨滴 -->
    <path d="M 35,72 C 35,75 30,82 30,82 C 30,82 25,75 25,72 C 25,69 29,67 30,67 C 31,67 35,69 35,72 Z" fill="#38bdf8" />
    <path d="M 75,76 C 75,79 70,86 70,86 C 70,86 65,79 65,76 C 65,73 69,71 70,71 C 71,71 75,73 75,76 Z" fill="#38bdf8" />
  </g>

  <!-- 滴滴主身體 (淚滴型果凍怪獸) -->
  <g filter="url(#shadow)">
    <path d="M 200,105 C 275,180 305,250 295,310 C 285,365 240,380 200,380 C 160,380 115,365 105,310 C 95,250 125,180 200,105 Z" 
          fill="url(#dropGrad)" />
  </g>

  <!-- 垂下來的軟萌小耳朵 -->
  <path d="M 125,220 C 90,230 65,280 85,305 C 100,320 125,290 130,265 Z" fill="#0284c7" />
  <path d="M 275,220 C 310,230 335,280 315,305 C 300,320 275,290 270,265 Z" fill="#0284c7" />

  <!-- 身體高光 -->
  <path d="M 155,165 C 170,135 195,120 205,120 C 200,135 180,160 160,180 Z" fill="#ffffff" opacity="0.6" />

  <!-- 眼睛與水汪汪大淚珠 -->
  <!-- 左眼 -->
  <ellipse cx="165" cy="245" rx="14" ry="20" fill="#0f172a" />
  <circle cx="161" cy="238" r="6" fill="#ffffff" />
  <circle cx="169" cy="253" r="3" fill="#ffffff" />
  <ellipse cx="152" cy="272" rx="10" ry="14" fill="#38bdf8" opacity="0.85" />
  <!-- 右眼 -->
  <ellipse cx="235" cy="245" rx="14" ry="20" fill="#0f172a" />
  <circle cx="231" cy="238" r="6" fill="#ffffff" />
  <circle cx="239" cy="253" r="3" fill="#ffffff" />
  <ellipse cx="248" cy="272" rx="10" ry="14" fill="#38bdf8" opacity="0.85" />

  <!-- 哭泣嘴巴 (小波浪委屈嘴) -->
  <path d="M 188,285 Q 200,275 212,285" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

  <!-- 害羞/微紅腮紅 -->
  <ellipse cx="138" cy="265" rx="12" ry="7" fill="#f43f5e" opacity="0.35" />
  <ellipse cx="262" cy="265" rx="12" ry="7" fill="#f43f5e" opacity="0.35" />

  <!-- 胸前破掉的 100 分考卷 -->
  <g transform="translate(165, 310) rotate(-6)">
    <rect width="70" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="12" y="24" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ef4444">45分</text>
    <path d="M 40,8 L 60,35" stroke="#ef4444" stroke-width="2" />
    <path d="M 10,36 L 55,36" stroke="#cbd5e1" stroke-width="2" />
  </g>
</svg>
