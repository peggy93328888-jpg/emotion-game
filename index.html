<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心靈特工隊：情緒大冒險</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      user-select: none;
    }
    .font-cute {
      font-family: 'Mochiy Pop One', 'Noto Sans TC', cursive;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    /* 動畫效果 */
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse-flame {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.5)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 20px rgba(249, 115, 22, 0.8)); }
    }
    @keyframes breathe-circle {
      0% { transform: scale(0.6); opacity: 0.6; }
      40% { transform: scale(1.15); opacity: 1; }
      70% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.6); opacity: 0.6; }
    }
    .animate-bounce-slow {
      animation: bounce-slow 2.5s infinite ease-in-out;
    }
    .animate-flame {
      animation: pulse-flame 1.5s infinite ease-in-out;
    }
    .breathing-anim {
      animation: breathe-circle 10s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <!-- 遊戲主視窗容器 (16:9 比例最佳化) -->
  <div id="game-container" class="relative w-full max-w-4xl h-[650px] bg-slate-800 rounded-3xl overflow-hidden shadow-2xl border-4 border-amber-300 flex flex-col justify-between select-none">
    
    <!-- 背景層 (動態切換背景) -->
    <div id="game-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-700 brightness-90 z-0" 
         style="background-image: url('assets/bg_playground.jpg'); background-color: #38bdf8;">
      <!-- 柔光遮罩 -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/30 pointer-events-none"></div>
    </div>

    <!-- 頂部資訊列 (HUD) -->
    <header class="relative z-10 flex items-center justify-between p-4 bg-white/80 backdrop-blur-md border-b-2 border-amber-200">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🎒</span>
        <div>
          <h1 class="font-cute text-lg sm:text-xl text-amber-900 font-bold tracking-wide">心靈特工隊：情緒大冒險</h1>
          <p id="hud-subtitle" class="text-xs text-amber-700">任務目標：找出同理心解藥，拯救被情緒困擾的同學！</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <!-- EQ 能量能量條 -->
        <div class="flex flex-col items-end">
          <div class="flex items-center gap-1 text-xs font-bold text-slate-700">
            <span>✨ EQ 心靈能量</span>
            <span id="eq-val" class="text-amber-600">50</span>/100
          </div>
          <div class="w-28 sm:w-36 h-3 bg-slate-200 rounded-full overflow-hidden border border-amber-300">
            <div id="eq-bar" class="h-full bg-gradient-to-r from-amber-400 to-emerald-400 transition-all duration-500" style="width: 50%;"></div>
          </div>
        </div>

        <!-- 音效開關 -->
        <button id="btn-sound" class="p-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-800 transition active:scale-95" title="切換音效">
          🔊
        </button>
      </div>
    </header>

    <!-- 遊戲主要視圖舞台 (關卡/對白/互動) -->
    <main id="game-stage" class="relative z-10 flex-1 flex flex-col justify-between p-4 sm:p-6 overflow-hidden">
      <!-- 內容將由 JS 動態注入 -->
    </main>

  </div>

  <script src="game.js"></script>
</body>
</html>
